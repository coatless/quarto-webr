name: Tests

# Quarto is deliberately left unpinned here. publish-demo.yml pins an exact
# version so the published site is reproducible, which leaves this workflow as
# the canary: it runs against whatever Quarto ships next, so an upstream change
# - like the 1.9.19 language-scan widening that sent every `{webr-r}` document
# to the jupyter engine - turns the test suite red rather than the docs build.

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * *'

jobs:
  fast:
    name: Lua, render, and JS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lua unit tests
        run: npm run test:lua
      - name: Render and JS tests
        run: npm run test:fast

  browser:
    name: Browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
